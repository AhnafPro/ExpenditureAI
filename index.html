<!DOCTYPE html>

    <head>

        <div class="topbar">
            <img src="icon.png" class="topbaricon">
            <p class="brand-text">expenditure<b>AI</b></p>
        </div>

        <div class="main-dashboard">
            <div class="card forcastbox">
                <p style="font-family: Big Shoulders, sans-serif; color: white; font-size: 30px; margin-left: 25px; margin-top: 20px;"><b id="dynamicnmonth">MONTH</b> FORECAST</p>
                <p id="dynamictotalcost" style="font-family: Montserrat, sans-serif; color: rgb(127, 255, 98); font-size: 90px; margin-left: 25px; font-weight: 100; margin-top: -5px; overflow: visible;">$0.00</p>
                <p style="font-family: Montserrat, sans-serif; color: white; font-size: 15px; margin-left: 28px; font-weight: 400; margin-top: -89px;"><b>Projected Expenses</b></p>
           
                <div style="width: 60vh; height: 10vh; background-color: #161616; border-radius: 6px; margin-left: 8%; display: flex; align-items: center; justify-content: space-around;">
    <input type="number" id="manualAmountInput" placeholder="0.00" style="width: 25%; height: 40px; border-radius: 6px; border: none; background-color: #1e1e1e; color: white; text-align: center; font-size: 16px;" oninput="calculateManualUSD()">

<select id="currencySelect" onchange="calculateManualUSD()" style="width: 25%; height: 40px; border-radius: 6px; border: none; background-color: #1e1e1e; color: white; text-align: center; font-size: 16px;">
    <option value="USD">USD</option>
    <option value="CAD">CAD</option>
    <option value="MXN">MXN</option>
    <option value="BRL">BRL</option>

    <option value="CLP">CLP</option>

    <option value="SAR">SAR</option>
    <option value="QAR">QAR</option>
    <option value="KWD">KWD</option>
    <option value="OMR">OMR</option>

    <option value="NGN">NGN</option>
    <option value="ZAR">ZAR</option>
    <option value="KES">KES</option>
    <option value="EUR">EUR</option>
    <option value="GBP">GBP</option>
    <option value="CHF">CHF</option>
    <option value="SEK">SEK</option>
    <option value="NOK">NOK</option>
    <option value="PLN">PLN</option>
    <option value="TRY">TRY</option>
    <option value="INR">INR</option>
    <option value="JPY">JPY</option>
    <option value="CNY">CNY</option>
    <option value="AUD">AUD</option>
    <option value="NZD">NZD</option>
    <option value="SGD">SGD</option>
    <option value="HKD">HKD</option>
    <option value="KRW">KRW</option>
    <option value="MYR">MYR</option>
    <option value="THB">THB</option>
    <option value="IDR">IDR</option>
    <option value="PHP">PHP</option>
    <option value="VND">VND</option>
    <option value="PKR">PKR</option>
</select>

<p id="manualUSDResult" style="display: inline-block; color: #7fff62; font-family: Montserrat, sans-serif; font-size: 16px; margin-left: 2vh; font-weight: bold;">$0.00 USD</p></div>
        <p align="center" style="font-size: 8px; color: white;">🟥LA 🟧ME 🟨AS🟩EU🟦AF ⬜️NA</p>
            <center>    <div class="globe" style="width: 60vh; height: 60vh;">

<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<model-viewer style="background-color:rgba(255, 0, 0, 0);" src="https://cdn.tinyglb.com/models/7dc2987f71384094aa9b73a0e7d1796d.glb" shadow-intensity="1" camera-controls></model-viewer>
            </div>
            
        </center>
            </div>

            <div class="middle-column">
                <div class="card additembox">
                    <div class="active-header">
                        <p style="font-family: Big Shoulders, sans-serif; color: white; font-size: 20px; margin-left: 25px; margin-top: 17px;">ACTIVE EXPENSES</p>
                        <button class="add-btn" onclick="createExpenseCard()">+</button>
                    </div>

                    <div id="expenseContainer" class="expense-list-wrapper"></div>
                </div>

                <div class="card aioutputbox">
                    <div class="active-header">
                        <p style="font-family: Big Shoulders, sans-serif; color: white; font-size: 20px; margin-left: 25px; margin-top: 17px;">SMART CUTS</p>
                        <button class="ai-btn" onclick="analyzeAI()">Analyze</button>
                    </div>
                    <div id="aiOutput" class="ai-container"></div>
                </div>
            </div>

            <div class="card bargraphcomparison">
                <p style="font-family: Big Shoulders, sans-serif; color: white; font-size: 30px; margin-left: 25px; margin-top: 20px;">OPTIMIZATION IMPACT</p>
                <div class="chart-wrapper">
                    <center>
                        <div style="height: 35vh; background-color: #161616; width: 96%; border-radius: 9px;">
                      
                            
                    </div>
                    <div style="height: 35vh; background-color: #161616; width: 96%; border-radius: 9px;">
                        <p style="font-family: Big Shoulders, sans-serif; color: white; font-size: 30px; text-align:left; margin-left: 20px; font-size: 20px;line-height: 2.5;" class="noteheader">NOTES</p>
                        <textarea class="notes" id="notes" placeholder="Write your notes here..."></textarea>
                  
                    </div>
                    </center>
                </div>
            </div>
        </div>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
